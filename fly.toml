# Fly.io config for the CollabText WebSocket relay.
# Deploy from repo root: fly deploy
#
# The process reads PORT from the environment (Fly sets this; default in
# packages/server is 8080). internal_port must match.

app = "collabtext-relay"
primary_region = "iad"

[build]
  dockerfile = "packages/server/Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
